[project]
name = "lab74"
version = "2.0.0"
description = "Matplotlib style layer for scientific and institutional figures in the technical print style of ca. 1965–1980."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Karsten Economou", email = "economoukarsten@gmail.com" },
]
requires-python = ">=3.12"
keywords = ["matplotlib", "plotting", "style", "scientific-visualization"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/KarstenEconomou/lab74"
Repository = "https://github.com/KarstenEconomou/lab74"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pytest>=8.0",
    "ruff>=0.16",
    "scipy>=1.14",
    "ty>=0.0.78",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "FA",   # flake8-future-annotations
    "F",    # pyflakes
    "I",    # isort
    "ISC",  # flake8-implicit-str-concat
    "N",    # pep8-naming
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "RUF",  # ruff
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    # The plot tools are deliberately keyword-rich, and their layout routines
    # read better whole than split apart.
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0915",  # too-many-statements
    # Array shapes, tuple lengths, and axes fractions are clearer as literals.
    "PLR2004",  # magic-value-comparison
    # Typographic dashes are the point of this library.
    "RUF001",  # ambiguous-unicode-character-string
    # `+` on a Matplotlib transform result is array arithmetic, not concatenation.
    "RUF005",  # collection-literal-concatenation
]

[tool.ruff.lint.per-file-ignores]
# Test names carry the documentation, and fixtures compare against literals.
"tests/*" = ["D100", "D103", "PLR2004", "PT018"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
unused-ignore-comment = "error"
